[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true
[[redirects]]
  from = "/api/photo-to-text"
  to = "/.netlify/functions/photo-to-text"
  status = 200
  force = true
[[redirects]]
  from = "/api/generate-image-quiz"
  to = "/.netlify/functions/generate-image-quiz"
  status = 200
  force = true
[[redirects]]
  from = "/api/summarize-notes-image"
  to = "/.netlify/functions/summarize-notes-image"
  status = 200
  force = true
[[redirects]]
  from = "/api/notes-to-bullets-image"
  to = "/.netlify/functions/notes-to-bullets-image"
  status = 200
  force = true
[[redirects]]
  from = "/api/generate-flashcards-image"
  to = "/.netlify/functions/generate-flashcards-image"
  status = 200
  force = true

[[redirects]]
  from = "/api/newsletter"
  to = "/.netlify/functions/newsletter"
  status = 200
  force = true
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://toolshala.in; font-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true
