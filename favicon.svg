<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ToolShala favicon</title>
  <desc id="desc">A clean white ToolShala T monogram centered on a blue and violet gradient badge.</desc>
  <defs>
    <linearGradient id="toolshalaBadge" x1="9" y1="7" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.52" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="badgeShine" cx="18" cy="12" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.15" flood-color="#0f172a" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#toolshalaBadge)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#badgeShine)"/>
  <g fill="#ffffff" filter="url(#softShadow)">
    <rect x="15" y="15" width="34" height="10" rx="3"/>
    <rect x="27" y="23" width="10" height="28" rx="3"/>
  </g>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
</svg>
